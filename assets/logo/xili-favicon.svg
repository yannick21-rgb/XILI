<?xml version="1.0" encoding="UTF-8"?>
<!--
  XILI — favicon (marque en couleurs, teintes figees)

  Meme geometrie et meme teintes que xili-marque-couleur.svg, sans variable
  CSS : un favicon est rendu hors de la page, il n'herite de rien.

  Plaque encre toujours presente, exactement sur l'emprise du trait (460
  unites, rayon 98) : sur fond sombre elle se confond, sur fond clair elle
  porte la marque. C'est la plaque qui rend le logo lisible partout — jamais
  les teintes chaudes seules, qui tombent a 2.52:1 sur ivoire (§4.3).
  Proportions mesurées sur xili-design/Logo en couleur.pdf, voir le fichier
  couleur pour le detail du calcul.

  Note de taille : la marque ne se lit plus en dessous de ~24 px — a 16 px
  elle se reduit a quatre points (verifie au rendu). Ce fichier sert donc aux
  navigateurs qui agrandissent, pas au lisible a 16 px.
-->
