<!--
  XILI — marque en couleurs

  Source : /home/jhpy/Images/XILI-logo.svg (Jean Yannick, 2026-10-28),
  coloriage relu sur xili-design/Logo en couleur.pdf.

  Affectation des teintes (mesuree sur la planche, pas devinee) :
    path 1  le ruban en S   -> Orange brule #FF6B2C
    path 2  disque haut-g.  -> Safran       #FFC53D
    path 3  disque bas-dr.  -> Safran       #FFC53D
    stroke  les vides       -> Encre        #12151F

  LA PLAQUE — mesurée, pas choisie
  =================================
  La planche pose la marque sur un carre encre arrondi des que le fond n'est
  pas deja de l'encre. On la met donc TOUJOURS : sur fond sombre elle se
  confond, sur fond clair elle porte la marque. Un seul fichier, tous les
  fonds. C'est la plaque qui tient le contraste, jamais les teintes chaudes
  seules — sur ivoire l'orange tombe a 2.52:1 (DESIGN.md §4.3).

  La plaque vaut exactement l'emprise de la marque, strokes compris :
  460 unites (67.638 a 527.638). Aucune marge. Verifie par mesure sur la
  tuile ivoire de la planche, a taille native :

      PDF : plaque 107x107, boite chaude 80x80  -> 74.8%
      SVG : plaque 107x107, boite chaude 78x78  -> 72.9%

  L'ecart de 2 px est de l'antialiasing entre deux rasteriseurs, pas de la
  geometrie. Une premiere version portait la plaque a 540 unites (marge de
  40) : la boite chaude y tombait a 62.3%, deux fois trop serre. D'ou la
  regle — la plaque n'est pas un cadre autour du logo, c'est son gabarit.

  Rayon : 21.3% du cote -> 98 sur 460. Mesure par ajustement circulaire sur
  le profil du coin de la tuile ivoire (inset(k) = r - sqrt(r^2-(r-k)^2)),
  la courbe s'arrete a k=9 sur un cote de 108. La methode est validée : en
  l'appliquant a notre propre rendu, elle rend 18.5%, qui est exactement la
  valeur connue (85/460) — donc elle ne ment pas. Un premier calcul par
  simple profil donnait 18.5% pour la planche : faux, il s'arretait au
  premier pixel nul, faussé par l'antialiasing. C'est la comparaison à 4x
  qui a trahi l'erreur, pas la mesure native.

  Note de taille : la marque ne se lit plus en dessous de ~24 px — a 16 px
  elle se reduit a quatre points (verifie au rendu).

  Les teintes de marque sont FIXES : la planche utilise le meme orange et le
  meme safran sur les trois fonds. Seul le ruban passe en ivoire sur fond
  orange (variante non utilisee par l'interface).
-->
