<?xml version="1.0" encoding="UTF-8"?>
<!--
  XILI — marque (emblème)

  Source : /home/jhpy/Images/XILI-logo.svg (fourni par Jean Yannick, 2026-10-28).
  Recadrée sur la forme réelle : viewBox d'origine A4 (595.276 x 841.89),
  la marque occupe 400 x 400 ; on garde 30 de marge pour le stroke de 60.

  Géométrie : deux disques (r = 100) aux centres (197.638, 286.338) et
  (397.638, 486.338), plus un ruban en S dont deux arcs coïncident avec la
  circonférence de ces disques. Les décalages entre les trois formes sont
  créés par le stroke, pas par des trous dans les tracés.

  Couleur : monochrome, pilotée par la variable CSS nommée marque
  (défaut : Ivoire). docs/DESIGN.md §4.1 assigne Ivoire à « texte, logo ».
  Le logo suit donc currentColor et s'adapte aux deux thèmes sans fichier
  distinct.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="67.638 156.338 460 460"
     role="img" aria-label="Emblème XILI">
  <title>Emblème XILI</title>
  <style>
    .marque-forme {
      fill: var(--marque, #F6F1E7);
      stroke: var(--marque-fond, #12151F);
      stroke-width: 60;
      stroke-miterlimit: 10;
    }
  </style>
  <g>
