# Configuration GRUB pour le chemin UEFI (J2.1).
set timeout=0
set default=0

insmod font
loadfont unicode
insmod all_video
insmod gfxterm
set gfxmode=1024x768x32
set gfxpayload=1024x768x32
terminal_output gfxterm

search --file --set=root --no-floppy /boot/kernel

menuentry "XILI (multiboot2, UEFI)" {
    multiboot2 /boot/kernel
    boot
}