# Configuration GRUB pour le chemin UEFI (J2.1).
#
# En UEFI, GRUB est lancé directement par le firmware (OVMF) au lieu d'être
# chargé par le BIOS depuis le MBR. Le firmware a déjà placé la machine en
# mode long 64 bits avec pagination active : boot.s reprend la main sur ses
# propres tables de pages, c'est volontaire.
#
# `search --file` reste nécessaire : GRUB démarre avec pour `root` le memdisk
# interne de grub-mkstandalone, pas la partition qui porte le noyau.

set timeout=0
set default=0

search --file --set=root --no-floppy /boot/kernel

menuentry "XILI (multiboot2, UEFI)" {
    multiboot2 /boot/kernel
    boot
}
